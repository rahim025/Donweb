{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Créer un compte Donweb</h1>
    <form method="POST">
        <input type="text" name="full_name" placeholder="Nom complet" required>
        <input type="email" name="email" placeholder="Email professionnel" required>
        <input type="text" name="subject" placeholder="Matière enseignée">
        <input type="password" name="password" placeholder="Mot de passe" required>
        <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>
    <p><a href="{{ url_for('auth.login') }}">J'ai déjà un compte</a></p>
</div>
{% endblock %}
