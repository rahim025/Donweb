{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-visual">
        <div class="auth-icon-bg">
            <img src="{{ url_for('static', filename='img/don_bosco_icon.jpg') }}" alt="Don Bosco" class="auth-icon-img">
        </div>
        <div class="auth-visual-overlay">
            <h2>Lycée Don Bosco</h2>
            <p>« Il suffit que vous soyez jeunes pour que je vous aime. »</p>
        </div>
    </div>
    <div class="auth-form-side">
        <div class="auth-card animated-card">
            <h1>Donweb</h1>
            <p class="subtitle">Le réseau des enseignants du Lycée Don Bosco</p>
            <form method="POST">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Mot de passe" required>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
            <p><a href="{{ url_for('auth.register') }}">Créer un compte</a></p>
        </div>
    </div>
</div>
{% endblock %}
